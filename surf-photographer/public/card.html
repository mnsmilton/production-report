<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tarjeta QR</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body { background: #fff; color: #0b2a3a; }
  .sheet { width: 340px; margin: 24px auto; border: 3px solid #0b2a3a; border-radius: 20px; padding: 24px; text-align: center; background: #fff; }
  .sheet h1 { margin: 0; font-size: 30px; letter-spacing: .02em; text-transform: uppercase; }
  .sheet .ses { margin: 4px 0 14px; color: #5b7482; font-size: 14px; }
  .sheet img { width: 260px; height: 260px; margin: 0 auto; }
  .sheet .big { font-size: 20px; font-weight: 800; margin-top: 10px; }
  .sheet .en { color: #5b7482; font-size: 14px; }
  .sheet .url { font-size: 12px; color: #5b7482; margin-top: 8px; word-break: break-all; }
  .bar { text-align: center; margin: 18px; }
</style>
</head>
<body>
<div class="bar noprint"><button class="btn" onclick="print()">Imprimir</button></div>
<div class="sheet">
  <h1 id="brand">Chonfotos</h1>
  <div class="ses" id="ses"></div>
  <img id="qr" alt="QR">
  <div class="big">¡Escanea y encuentra tus fotos!</div>
  <div class="en">Scan to find your photos &amp; videos</div>
  <div class="url" id="url"></div>
</div>
<script type="module">
const code = location.pathname.split('/')[2];
const cfg = await (await fetch('/api/config')).json();
document.querySelector('#brand').textContent = cfg.brand;
document.title = `Tarjeta · ${cfg.brand}`;
const path = code === '_' ? '/' : `/s/${code}`;
document.querySelector('#qr').src = `/api/qr.svg?path=${encodeURIComponent(path)}`;
if (code !== '_') {
  const r = await fetch('/api/sessions/' + code);
  if (r.ok) { const s = await r.json(); document.querySelector('#ses').textContent = [s.name, s.spot].filter(Boolean).join(' · '); document.querySelector('#url').textContent = s.url.replace(/^https?:\/\//, ''); }
} else document.querySelector('#url').textContent = location.host;
</script>
</body>
</html>
