<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel · Admin</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="center" id="loginView" hidden>
  <form class="panel narrow" id="loginForm">
    <h2>Panel del fotógrafo</h2>
    <label class="field" style="text-align:left">Contraseña
      <input type="password" id="pw" required autocomplete="current-password" autofocus></label>
    <p class="msg err" id="loginMsg"></p>
    <button class="btn" style="width:100%">Entrar</button>
  </form>
</div>

<div class="wrap" id="appView" hidden>
  <header style="display:flex;justify-content:space-between;align-items:center;padding:18px 0">
    <h1 style="margin:0;font-size:22px">Panel del fotógrafo</h1>
    <span><a href="/" target="_blank">Ver sitio</a> · <a href="#" id="logout">Salir</a></span>
  </header>

  <section class="panel">
    <h2>Subir fotos y videos</h2>
    <form id="upForm">
      <div class="drop" id="drop">
        Arrastra aquí tus archivos o <label style="color:var(--sea);cursor:pointer;text-decoration:underline">elígelos
        <input type="file" id="files" multiple accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm" hidden></label>
        <div id="picked" style="margin-top:6px"></div>
      </div>
      <div class="row" style="margin-top:14px">
        <label class="field">Playa / spot <input id="spot" list="spots" placeholder="Playa Hermosa, Santa Teresa…"></label>
        <datalist id="spots"></datalist>
        <label class="field">Fecha de la sesión <input type="date" id="date"></label>
        <label class="field">Precio (USD) <input type="number" id="price" min="1" step="0.5" value="20"></label>
        <label class="field">Título (opcional) <input id="title" maxlength="120"></label>
      </div>
      <button class="btn" id="upBtn">Subir con marca de agua</button>
      <span class="msg" id="upMsg" style="margin-left:10px"></span>
    </form>
  </section>

  <section class="panel">
    <h2>Ventas</h2>
    <div class="stats"><div><b id="sTotal">$0</b>Total vendido</div><div><b id="sCount">0</b>Ventas</div></div>
    <div class="items" id="orders" style="margin-top:14px"></div>
  </section>

  <section class="panel">
    <h2>Contenido publicado</h2>
    <div class="items" id="list"></div>
  </section>
</div>
<script src="/admin.js" type="module"></script>
</body>
</html>
