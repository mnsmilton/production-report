<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chonfotos</title>
<meta name="description" content="Fotos y videos de surf en Costa Rica. Encuentra tu sesión y descarga el original en alta calidad.">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="/" id="logo">Chonfotos</a>
  <div class="right">
    <button class="cartbtn" id="cartBtn" type="button"><span aria-hidden="true">🛒</span> <span data-i18n="cart"></span><span class="n" id="cartN">0</span></button>
    <div class="lang" role="group" aria-label="Idioma">
      <button data-lang="es" aria-pressed="true">ES</button><button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</div></header>

<section class="hero">
  <div class="wrap">
    <h1 id="h1"></h1>
    <p data-i18n="hero_sub"></p>
    <a class="cta" href="#galeria" data-i18n="hero_cta"></a>
  </div>
  <svg class="waves" viewBox="0 0 1440 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40c120 30 240 30 360 0s240-30 360 0 240 30 360 0 240-30 360 0v30H0z"/></svg>
</section>

<main class="wrap" id="galeria">
  <div class="banner" id="banner" hidden>
    <div><h2 id="bName"></h2><p id="bSub"></p></div>
    <div class="acts">
      <button class="btn sun small" id="bAll" type="button"></button>
      <a class="btn ghost small" id="bWa" target="_blank" rel="noopener" data-i18n="share_wa"></a>
      <button class="btn ghost small" id="bCopy" type="button" data-i18n="copy_link"></button>
      <a class="btn ghost small" href="/" data-i18n="all_sessions"></a>
    </div>
  </div>

  <div class="filters">
    <label><span data-i18n="f_session"></span><select id="fSession"></select></label>
    <label><span data-i18n="f_spot"></span><select id="fSpot"></select></label>
    <label><span data-i18n="f_date"></span><select id="fDate"></select></label>
    <div class="chips">
      <button class="chip" data-kind="" aria-pressed="true" data-i18n="k_all"></button>
      <button class="chip" data-kind="photo" aria-pressed="false" data-i18n="k_photo"></button>
      <button class="chip" data-kind="video" aria-pressed="false" data-i18n="k_video"></button>
    </div>
  </div>
  <div class="packs" id="packs"></div>
  <p class="hint" data-i18n="hint"></p>
  <div class="grid" id="grid"></div>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<dialog id="dlg">
  <button class="close" id="dlgClose" aria-label="Cerrar">✕</button>
  <div class="modal">
    <div class="stage" id="stage"></div>
    <div class="side">
      <h2 id="mTitle"></h2>
      <p class="sub" id="mSub"></p>
      <ul><li data-i18n="b1"></li><li data-i18n="b2"></li><li id="b3"></li></ul>
      <button class="btn sun" id="mAdd" type="button" style="width:100%"></button>
      <button class="btn ghost" id="mCart" type="button" style="width:100%" data-i18n="go_cart"></button>
    </div>
  </div>
</dialog>

<dialog id="cartDlg">
  <button class="close" id="cartClose" aria-label="Cerrar">✕</button>
  <div class="cart">
    <h2 data-i18n="cart_title"></h2>
    <div id="cartItems"></div>
    <div id="cartEmpty" class="note" data-i18n="cart_empty" hidden></div>
    <div id="cartBody">
      <div class="upsell" id="upsell" hidden></div>
      <div class="totals" id="totals"></div>
      <form id="payForm" style="display:grid;gap:12px;margin-top:12px" novalidate>
        <label class="field"><span data-i18n="email_label"></span>
          <input type="email" id="email" required autocomplete="email" placeholder="you@email.com"></label>
        <label class="field"><span data-i18n="phone_label"></span>
          <input type="tel" id="phone" autocomplete="tel" placeholder="8888 8888"></label>
        <div class="methods" id="methods"></div>
        <div id="paypal-box"></div>
        <button class="btn sun" id="payBtn" type="submit" style="width:100%"></button>
        <div class="msg" id="msg" role="status"></div>
      </form>
    </div>
  </div>
</dialog>
<script src="/app.js" type="module"></script>
</body>
</html>
